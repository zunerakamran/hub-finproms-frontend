# .github/workflows/deploy.yml
name: Build & Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install & Build (shared + myhub)
        run: |
          npm ci
          npm run build:shared
          npm run build:myhub
          echo "---- dist-shared/index.html ----"
          cat dist-shared/index.html
          echo "---- dist-myhub/index.html ----"
          cat dist-myhub/index.html

      # IMPORTANT:
      # If your FTP user already lands inside public_html, server-dir must be ./
      # If FTP lands in the home directory, server-dir must be /public_html/
      # Wrong value uploads "successfully" to a folder the domain does NOT serve.
      - name: Deploy shared hub via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER_1 }}
          username: ${{ secrets.FTP_USER_1 }}
          password: ${{ secrets.FTP_PASS_1 }}
          local-dir: ./dist-shared/
          # If FTP login already opens inside public_html, change this to ./
          server-dir: /public_html/
          log-level: verbose
          exclude: |
            **/api/**
            **/.env
            **/.env.*
            **/storage/**
            **/vendor/**

      - name: Deploy white-label hub via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER_2 }}
          username: ${{ secrets.FTP_USER_2 }}
          password: ${{ secrets.FTP_PASS_2 }}
          local-dir: ./dist-myhub/
          # If FTP login already opens inside public_html, change this to ./
          server-dir: /public_html/
          log-level: verbose
          exclude: |
            **/api/**
            **/.env
            **/.env.*
            **/storage/**
            **/vendor/**

      - name: Verify live sites received this build
        run: |
          set -e
          echo "Checking sharedhub..."
          SHARED=$(curl -fsSL "https://sharedhub.fin-proms.com/index.html?v=$GITHUB_SHA")
          echo "$SHARED" | head -n 20
          echo "$SHARED" | grep -q "BUILD_OK_V3"

          echo "Checking myhub..."
          MYHUB=$(curl -fsSL "https://myhub.fin-proms.com/index.html?v=$GITHUB_SHA")
          echo "$MYHUB" | head -n 20
          echo "$MYHUB" | grep -q "BUILD_OK_V3"

          echo "Live sites show BUILD_OK_V3 — deploy OK"
