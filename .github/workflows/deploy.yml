# .github/workflows/deploy.yml
name: Build & Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install & Build (shared + myhub)
        run: |
          npm ci
          npm run build:shared
          npm run build:myhub
          echo "---- dist-shared/index.html ----"
          cat dist-shared/index.html
          grep -q "BUILD_OK_V3" dist-shared/index.html
          grep -q "BUILD_OK_V3" dist-myhub/index.html

      # CRITICAL (cPanel):
      # The FTP account Directory must be the domain document root:
      #   /home/<USER>/public_html
      # NOT:
      #   /home/<USER>/sharedhub.fin-proms.com/ftpaccount
      #   /home/<USER>/myhub.fin-proms.com/ftpaccount
      # Fix in cPanel → FTP Accounts → Change Directory, then re-run this workflow.
      #
      # server-dir is ./ because the FTP user should already land IN public_html.
      - name: Deploy shared hub via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER_1 }}
          username: ${{ secrets.FTP_USER_1 }}
          password: ${{ secrets.FTP_PASS_1 }}
          local-dir: ./dist-shared/
          server-dir: ./
          exclude: |
            **/api/**
            **/.env
            **/.env.*
            **/storage/**
            **/vendor/**

      - name: Deploy white-label hub via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER_2 }}
          username: ${{ secrets.FTP_USER_2 }}
          password: ${{ secrets.FTP_PASS_2 }}
          local-dir: ./dist-myhub/
          server-dir: ./
          exclude: |
            **/api/**
            **/.env
            **/.env.*
            **/storage/**
            **/vendor/**

      - name: Verify live sites received this build
        run: |
          set -e
          sleep 2
          SHARED=$(curl -fsSL -H 'Cache-Control: no-cache' "https://sharedhub.fin-proms.com/index.html?v=$GITHUB_SHA")
          echo "$SHARED" | head -n 15
          if ! echo "$SHARED" | grep -q "BUILD_OK_V3"; then
            echo "::error::sharedhub still missing BUILD_OK_V3. FTP account Directory is wrong — set it to /home/USER/public_html in cPanel (not .../sharedhub.fin-proms.com/ftpaccount)."
            exit 1
          fi

          MYHUB=$(curl -fsSL -H 'Cache-Control: no-cache' "https://myhub.fin-proms.com/index.html?v=$GITHUB_SHA")
          echo "$MYHUB" | head -n 15
          if ! echo "$MYHUB" | grep -q "BUILD_OK_V3"; then
            echo "::error::myhub still missing BUILD_OK_V3. FTP account Directory is wrong — set it to /home/USER/public_html in cPanel (not .../myhub.fin-proms.com/ftpaccount)."
            exit 1
          fi

          echo "Live sites show BUILD_OK_V3 — deploy OK"
