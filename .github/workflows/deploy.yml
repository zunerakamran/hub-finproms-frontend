# .github/workflows/deploy.yml
name: Build & Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install & Build (shared + myhub)
        run: |
          npm ci
          npm run build:shared
          npm run build:myhub
          echo "---- dist-shared/index.html ----"
          cat dist-shared/index.html
          echo "---- dist-myhub/index.html ----"
          cat dist-myhub/index.html
          test -f dist-shared/index.html
          grep -q "BUILD_OK_V3" dist-shared/index.html
          grep -q "BUILD_OK_V3" dist-myhub/index.html

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # Uses lftp so we can see the real remote folder (pwd/ls) and force-overwrite index.html.
      # If pwd is wrong, fix FTP secrets (account / home directory) in GitHub → Settings → Secrets.
      - name: Deploy shared hub via lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER_1 }}
          FTP_USER: ${{ secrets.FTP_USER_1 }}
          FTP_PASS: ${{ secrets.FTP_PASS_1 }}
        run: |
          set -e
          test -n "$FTP_SERVER"
          test -n "$FTP_USER"
          test -n "$FTP_PASS"
          lftp -c "
            set cmd:fail-exit yes;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            open -u ${FTP_USER},${FTP_PASS} ${FTP_SERVER};
            echo '=== SHARED FTP PWD ===';
            pwd;
            echo '=== SHARED FTP LS (top) ===';
            cls -1;
            mirror -R --verbose \
              --exclude-glob api/** \
              --exclude-glob .env \
              --exclude-glob .env.* \
              --exclude-glob storage/** \
              --exclude-glob vendor/** \
              ./dist-shared/ .;
            put ./dist-shared/index.html -o index.html;
            echo '=== REMOTE index.html (first lines) ===';
            cat index.html;
          "

      - name: Deploy white-label hub via lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER_2 }}
          FTP_USER: ${{ secrets.FTP_USER_2 }}
          FTP_PASS: ${{ secrets.FTP_PASS_2 }}
        run: |
          set -e
          test -n "$FTP_SERVER"
          test -n "$FTP_USER"
          test -n "$FTP_PASS"
          lftp -c "
            set cmd:fail-exit yes;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            open -u ${FTP_USER},${FTP_PASS} ${FTP_SERVER};
            echo '=== MYHUB FTP PWD ===';
            pwd;
            echo '=== MYHUB FTP LS (top) ===';
            cls -1;
            mirror -R --verbose \
              --exclude-glob api/** \
              --exclude-glob .env \
              --exclude-glob .env.* \
              --exclude-glob storage/** \
              --exclude-glob vendor/** \
              ./dist-myhub/ .;
            put ./dist-myhub/index.html -o index.html;
            echo '=== REMOTE index.html (first lines) ===';
            cat index.html;
          "

      - name: Verify live sites received this build
        run: |
          set -e
          sleep 3
          echo "Checking sharedhub..."
          SHARED=$(curl -fsSL -H 'Cache-Control: no-cache' "https://sharedhub.fin-proms.com/index.html?v=$GITHUB_SHA")
          echo "$SHARED"
          echo "$SHARED" | grep -q "BUILD_OK_V3"

          echo "Checking myhub..."
          MYHUB=$(curl -fsSL -H 'Cache-Control: no-cache' "https://myhub.fin-proms.com/index.html?v=$GITHUB_SHA")
          echo "$MYHUB"
          echo "$MYHUB" | grep -q "BUILD_OK_V3"

          echo "Live sites show BUILD_OK_V3 — deploy OK"
